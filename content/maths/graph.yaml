# graph.yaml — source de vérité du DAG du parcours.
# Version 1 — 2026-09-09. À relire avant toute génération de code.
#
# Conventions
#   id             slug stable, jamais renommé (contenu, base et liens y font référence).
#   kind           domain | topic | concept. Seuls les `concept` portent contenu et progression.
#   parentId       vue hiérarchique de lecture. Aucun effet sur le déblocage.
#   requires       arêtes du DAG : prérequis réels, uniquement de concept à concept.
#                  Un topic est « disponible » dès qu'un de ses concepts l'est ;
#                  un domaine dès qu'un de ses topics l'est. Rien de tout cela n'est stocké.
#   estimatedHours renseigné sur les concepts uniquement. 0 sur domain/topic, où la valeur
#                  affichée est la somme des descendants (dérivée au chargement).
#   contentStatus  ABSENT de ce fichier (decision D2) : derive du systeme de fichiers
#                  au chargement. Pas de course.mdx -> `empty` ; sinon la valeur du
#                  frontmatter `status`. Chemin attendu pour un concept :
#                  content/<domain>/<topic>/<concept>/course.mdx
#
# Vocabulaire de tags (fermé — ne pas inventer de nouveau tag sans l'ajouter ici) :
#   analyse algebre combinatoire calculatoire mesure asymptotique inference
#   bayesien processus ml causal simulation donnees preuve
#
# Les arêtes traversent délibérément les niveaux : `mcmc` (niveau 4) dépend de
# `chaines-markov-ergodicite` (niveau 5), `rdd` (niveau 6) de `estimation-noyau`
# (niveau 6, autre topic). La numérotation des niveaux est une vue de lecture,
# l'ordre d'apprentissage réel est celui du DAG.

