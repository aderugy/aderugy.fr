project_id = "aderugy"

[functions.google-oauth]
verify_jwt = true

[functions.google-sync]
# Accepts either a user JWT or the service-role key; the function itself decides
# which path applies, so the platform gate stays on.
verify_jwt = true

[functions.google-channels]
verify_jwt = true

[functions.google-webhook]
# Google cannot present a Supabase JWT. The X-Goog-Channel-Token secret, matched
# against google_sync_channels, is what authenticates a ping.
verify_jwt = false

[functions.google-push]
# User JWT for enable/disable and "push mine now"; the service-role key for the
# cron sweep. The function decides which path applies.
verify_jwt = true
